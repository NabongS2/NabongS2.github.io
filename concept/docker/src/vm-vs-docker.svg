<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="가상 머신은 게스트 OS를 여러 벌 얹지만 컨테이너는 호스트 커널을 공유해 앱만 얹는다는 비교">
  <style>
    svg { --bg:#ffffff; --fg:#1b1b1f; --muted:#5c5f66; --line:#c8ccd4; --accent:#2f6fd0; --accent-soft:#eaf1fc; --card:#f2f4f8; --heavy:#b3541e; --heavy-soft:#fbeee4; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#17181c; --fg:#e8e9ed; --muted:#a3a7b0; --line:#3a3e47; --accent:#77aaf0; --accent-soft:#1c2941; --card:#22242b; --heavy:#e0a06a; --heavy-soft:#332519; }
    }
    .bg { fill: var(--bg); }
    .t { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .h1 { font-size: 18px; font-weight: 700; }
    .base { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
    .app { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
    .guest { fill: var(--heavy-soft); stroke: var(--heavy); stroke-width: 1.2; }
    .lbl { font-size: 13px; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .lbl-s { font-size: 11.5px; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .note { font-size: 12.5px; fill: var(--muted); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .tag { font-size: 11.5px; font-weight: 700; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  </style>
  <rect class="bg" width="900" height="470"/>

  <text class="t h1" x="40" y="44">가상 머신</text>
  <text class="tag" x="128" y="44" fill="var(--heavy)">무겁다</text>
  <text class="note" x="40" y="68">앱마다 OS를 통째로 하나씩 더 켠다.</text>

  <text class="t h1" x="470" y="44">컨테이너</text>
  <text class="tag" x="556" y="44" fill="var(--accent)">가볍다</text>
  <text class="note" x="470" y="68">호스트 커널을 같이 쓰고 앱만 얹는다.</text>

  <rect class="base" x="40" y="376" width="390" height="44" rx="8"/>
  <text class="lbl" x="235" y="403" text-anchor="middle">하드웨어</text>
  <rect class="base" x="40" y="328" width="390" height="44" rx="8"/>
  <text class="lbl" x="235" y="355" text-anchor="middle">호스트 OS</text>
  <rect class="base" x="40" y="280" width="390" height="44" rx="8"/>
  <text class="lbl" x="235" y="307" text-anchor="middle">하이퍼바이저</text>

  <rect class="guest" x="40" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="101" y="238" text-anchor="middle">게스트 OS</text>
  <text class="lbl-s" x="101" y="258" text-anchor="middle" fill="var(--muted)">수 GB</text>
  <rect class="app" x="40" y="160" width="122" height="46" rx="8"/>
  <text class="lbl-s" x="101" y="180" text-anchor="middle">라이브러리</text>
  <text class="lbl-s" x="101" y="198" text-anchor="middle">앱 A</text>

  <rect class="guest" x="174" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="235" y="238" text-anchor="middle">게스트 OS</text>
  <text class="lbl-s" x="235" y="258" text-anchor="middle" fill="var(--muted)">수 GB</text>
  <rect class="app" x="174" y="160" width="122" height="46" rx="8"/>
  <text class="lbl-s" x="235" y="180" text-anchor="middle">라이브러리</text>
  <text class="lbl-s" x="235" y="198" text-anchor="middle">앱 B</text>

  <rect class="guest" x="308" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="369" y="238" text-anchor="middle">게스트 OS</text>
  <text class="lbl-s" x="369" y="258" text-anchor="middle" fill="var(--muted)">수 GB</text>
  <rect class="app" x="308" y="160" width="122" height="46" rx="8"/>
  <text class="lbl-s" x="369" y="180" text-anchor="middle">라이브러리</text>
  <text class="lbl-s" x="369" y="198" text-anchor="middle">앱 C</text>

  <rect class="base" x="470" y="376" width="390" height="44" rx="8"/>
  <text class="lbl" x="665" y="403" text-anchor="middle">하드웨어</text>
  <rect class="base" x="470" y="328" width="390" height="44" rx="8"/>
  <text class="lbl" x="665" y="355" text-anchor="middle">호스트 OS · 커널 공유</text>
  <rect class="base" x="470" y="280" width="390" height="44" rx="8"/>
  <text class="lbl" x="665" y="307" text-anchor="middle">Docker 엔진</text>

  <rect class="app" x="470" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="531" y="238" text-anchor="middle">라이브러리</text>
  <text class="lbl-s" x="531" y="258" text-anchor="middle">앱 A</text>

  <rect class="app" x="604" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="665" y="238" text-anchor="middle">라이브러리</text>
  <text class="lbl-s" x="665" y="258" text-anchor="middle">앱 B</text>

  <rect class="app" x="738" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="799" y="238" text-anchor="middle">라이브러리</text>
  <text class="lbl-s" x="799" y="258" text-anchor="middle">앱 C</text>

  <text class="note" x="40" y="450">게스트 OS 세 벌이 각자 부팅한다. 뜨는 데 분 단위.</text>
  <text class="note" x="470" y="450">OS를 새로 켜지 않는다. 뜨는 데 초 단위.</text>
</svg>
