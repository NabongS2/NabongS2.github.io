<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="A virtual machine stacks a guest OS per app, while containers share the host kernel and stack only the app">
  <style>
    svg { --bg:#ffffff; --fg:#1b1b1f; --muted:#5c5f66; --line:#c8ccd4; --accent:#2f6fd0; --accent-soft:#eaf1fc; --card:#f2f4f8; --heavy:#b3541e; --heavy-soft:#fbeee4; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#17181c; --fg:#e8e9ed; --muted:#a3a7b0; --line:#3a3e47; --accent:#77aaf0; --accent-soft:#1c2941; --card:#22242b; --heavy:#e0a06a; --heavy-soft:#332519; }
    }
    .bg { fill: var(--bg); }
    .t { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .h1 { font-size: 18px; font-weight: 700; }
    .base { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
    .app { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
    .guest { fill: var(--heavy-soft); stroke: var(--heavy); stroke-width: 1.2; }
    .lbl { font-size: 13px; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .lbl-s { font-size: 11.5px; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .note { font-size: 12.5px; fill: var(--muted); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .tag { font-size: 11.5px; font-weight: 700; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  </style>
  <rect class="bg" width="900" height="470"/>

  <text class="t h1" x="40" y="44">Virtual machine</text>
  <text class="tag" x="204" y="44" fill="var(--heavy)">Heavy</text>
  <text class="note" x="40" y="68">Boots a whole OS for every app.</text>

  <text class="t h1" x="470" y="44">Container</text>
  <text class="tag" x="582" y="44" fill="var(--accent)">Light</text>
  <text class="note" x="470" y="68">Shares the host kernel, stacks only the app.</text>

  <rect class="base" x="40" y="376" width="390" height="44" rx="8"/>
  <text class="lbl" x="235" y="403" text-anchor="middle">Hardware</text>
  <rect class="base" x="40" y="328" width="390" height="44" rx="8"/>
  <text class="lbl" x="235" y="355" text-anchor="middle">Host OS</text>
  <rect class="base" x="40" y="280" width="390" height="44" rx="8"/>
  <text class="lbl" x="235" y="307" text-anchor="middle">Hypervisor</text>

  <rect class="guest" x="40" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="101" y="238" text-anchor="middle">Guest OS</text>
  <text class="lbl-s" x="101" y="258" text-anchor="middle" fill="var(--muted)">gigabytes</text>
  <rect class="app" x="40" y="160" width="122" height="46" rx="8"/>
  <text class="lbl-s" x="101" y="180" text-anchor="middle">Libraries</text>
  <text class="lbl-s" x="101" y="198" text-anchor="middle">App A</text>

  <rect class="guest" x="174" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="235" y="238" text-anchor="middle">Guest OS</text>
  <text class="lbl-s" x="235" y="258" text-anchor="middle" fill="var(--muted)">gigabytes</text>
  <rect class="app" x="174" y="160" width="122" height="46" rx="8"/>
  <text class="lbl-s" x="235" y="180" text-anchor="middle">Libraries</text>
  <text class="lbl-s" x="235" y="198" text-anchor="middle">App B</text>

  <rect class="guest" x="308" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="369" y="238" text-anchor="middle">Guest OS</text>
  <text class="lbl-s" x="369" y="258" text-anchor="middle" fill="var(--muted)">gigabytes</text>
  <rect class="app" x="308" y="160" width="122" height="46" rx="8"/>
  <text class="lbl-s" x="369" y="180" text-anchor="middle">Libraries</text>
  <text class="lbl-s" x="369" y="198" text-anchor="middle">App C</text>

  <rect class="base" x="470" y="376" width="390" height="44" rx="8"/>
  <text class="lbl" x="665" y="403" text-anchor="middle">Hardware</text>
  <rect class="base" x="470" y="328" width="390" height="44" rx="8"/>
  <text class="lbl" x="665" y="355" text-anchor="middle">Host OS · shared kernel</text>
  <rect class="base" x="470" y="280" width="390" height="44" rx="8"/>
  <text class="lbl" x="665" y="307" text-anchor="middle">Docker engine</text>

  <rect class="app" x="470" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="531" y="238" text-anchor="middle">Libraries</text>
  <text class="lbl-s" x="531" y="258" text-anchor="middle">App A</text>

  <rect class="app" x="604" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="665" y="238" text-anchor="middle">Libraries</text>
  <text class="lbl-s" x="665" y="258" text-anchor="middle">App B</text>

  <rect class="app" x="738" y="212" width="122" height="62" rx="8"/>
  <text class="lbl-s" x="799" y="238" text-anchor="middle">Libraries</text>
  <text class="lbl-s" x="799" y="258" text-anchor="middle">App C</text>

  <text class="note" x="40" y="450">Three guest OSes, each booting. Minutes to start.</text>
  <text class="note" x="470" y="450">No OS to boot. Seconds to start.</text>
</svg>
