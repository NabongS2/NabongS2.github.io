<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="The seven steps for rebuilding an image from a new jar and starting it">
  <style>
    svg { --bg:#ffffff; --fg:#1b1b1f; --muted:#5c5f66; --line:#c8ccd4; --accent:#2f6fd0; --accent-soft:#eaf1fc; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#17181c; --fg:#e8e9ed; --muted:#a3a7b0; --line:#3a3e47; --accent:#77aaf0; --accent-soft:#1c2941; }
    }
    .bg { fill: var(--bg); }
    .t { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .h1 { font-size: 20px; font-weight: 700; }
    .hsub { font-size: 13px; fill: var(--muted); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .step { font-size: 15px; font-weight: 600; }
    .cmd { font-family: "D2Coding", ui-monospace, "Consolas", monospace; font-size: 13px; fill: var(--accent); }
    .note { font-size: 11.5px; fill: var(--muted); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .num { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: var(--bg); }
    .dot { fill: var(--accent); }
    .rail { stroke: var(--line); stroke-width: 2; }
    .phase { font-size: 11.5px; font-weight: 700; fill: var(--muted); letter-spacing: .1em; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .band { fill: var(--accent-soft); }
  </style>

  <rect class="bg" width="900" height="700"/>

  <text class="t h1" x="40" y="46">Build it and run it</text>
  <text class="hsub" x="40" y="70">Top to bottom, every time you ship a new .jar.</text>

  <rect class="band" x="30" y="98" width="840" height="226" rx="14" opacity=".55"/>
  <line class="rail" x1="57" y1="128" x2="57" y2="616"/>

  <text class="phase" x="830" y="126" text-anchor="end">CLEAN UP</text>

  <circle class="dot" cx="57" cy="128" r="15"/>
  <text class="num" x="57" y="133" text-anchor="middle">1</text>
  <text class="t step" x="92" y="125">Check what is running</text>
  <text class="cmd" x="92" y="150">docker ps</text>

  <circle class="dot" cx="57" cy="196" r="15"/>
  <text class="num" x="57" y="201" text-anchor="middle">2</text>
  <text class="t step" x="92" y="193">Stop the old container, then remove it</text>
  <text class="cmd" x="92" y="218">docker stop {name}   →   docker rm {name}</text>
  <text class="note" x="92" y="238">It has to be stopped before it can be removed.</text>

  <circle class="dot" cx="57" cy="284" r="15"/>
  <text class="num" x="57" y="289" text-anchor="middle">3</text>
  <text class="t step" x="92" y="281">Remove the old image on that tag</text>
  <text class="cmd" x="92" y="306">docker images   →   docker image rm {imageID}</text>

  <text class="phase" x="830" y="350" text-anchor="end">DEPLOY</text>

  <circle class="dot" cx="57" cy="352" r="15"/>
  <text class="num" x="57" y="357" text-anchor="middle">4</text>
  <text class="t step" x="92" y="349">Drop in the new .jar and go to that folder</text>
  <text class="cmd" x="92" y="374">cd {project folder}</text>
  <text class="note" x="92" y="394">The folder with the Dockerfile. It becomes the build context.</text>

  <circle class="dot" cx="57" cy="440" r="15"/>
  <text class="num" x="57" y="445" text-anchor="middle">5</text>
  <text class="t step" x="92" y="437">Build the image</text>
  <text class="cmd" x="92" y="462">docker build -t myapp:{version} .</text>
  <text class="note" x="92" y="482">The trailing dot is the build context, the current folder. Easy to forget.</text>

  <circle class="dot" cx="57" cy="528" r="15"/>
  <text class="num" x="57" y="533" text-anchor="middle">6</text>
  <text class="t step" x="92" y="525">Run the container</text>
  <text class="cmd" x="92" y="550">docker run -d --name myapp -p 8080:8080 myapp:{version}</text>
  <text class="note" x="92" y="570">Once the options grow, bury them in a script like docker_run.sh and run that.</text>

  <circle class="dot" cx="57" cy="616" r="15"/>
  <text class="num" x="57" y="621" text-anchor="middle">7</text>
  <text class="t step" x="92" y="613">Check that it started</text>
  <text class="cmd" x="92" y="638">docker logs -f -n 100 {name}</text>
  <text class="note" x="92" y="658">-f follows new output. Ctrl+C to get out.</text>
</svg>
