<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="redis-cli 명령과 Java 메서드를 나란히 놓은 표지">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--bg1)"/>
      <stop offset="100%" stop-color="var(--bg2)"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <style>
    svg { --bg1:#f7f9fc; --bg2:#e6eefb; --fg:#1b1b1f; --muted:#5c5f66; --line:#c8ccd4; --accent:#2f6fd0; --accent-soft:#eaf1fc; --card:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --bg1:#1b1d22; --bg2:#141c2b; --fg:#e8e9ed; --muted:#a3a7b0; --line:#3a3e47; --accent:#77aaf0; --accent-soft:#1c2941; --card:#22242b; }
    }
    .t { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; fill: var(--fg); }
    .big { font-size: 68px; font-weight: 800; letter-spacing: -.01em; }
    .mid { font-size: 56px; font-weight: 800; letter-spacing: -.01em; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 2; }
    .card-a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .lab { font-size: 38px; font-weight: 700; fill: var(--fg); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .mono { font-family: "D2Coding", ui-monospace, "Consolas", monospace; font-size: 34px; font-weight: 700; fill: var(--fg); }
    .code { font-family: "D2Coding", ui-monospace, "Consolas", monospace; font-size: 30px; fill: var(--muted); }
    .tag { font-size: 24px; fill: var(--muted); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    .arrow { stroke: var(--accent); stroke-width: 4; fill: none; marker-end: url(#ar); }
  </style>

  <rect width="1200" height="630" fill="url(#g)"/>
  <rect x="80" y="86" width="72" height="6" rx="3" fill="var(--accent)"/>

  <text class="t mid" x="80" y="172">Spring 에서 Redis 쓰기</text>

  <rect class="card" x="80" y="300" width="400" height="200" rx="20"/>
